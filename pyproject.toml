[project]
name = "dmf-config-tool"
version = "0.1.0"
description = "Offline DMF configuration generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click",
    "jinja2",
    "openpyxl",
    "pydantic>=2.0",
    "pydantic-settings",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pip-audit",
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]
web = [
    "fastapi",
    "python-multipart",
    "uvicorn",
]

[project.scripts]
dmf-tool = "dmf_tool.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmf_tool"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/dmf_tool --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
exclude_lines = [
    "if __name__ == '__main__'",
    "pragma: no cover",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
